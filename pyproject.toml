[project]
name = "ai-infrastructure-mcp-llm-gateway"
version = "0.1.0"
description = "MCP server, MCP security gateway, streaming PII-redaction LLM gateway and token-aware model router."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.163",
    "httpx2>=2.16,<3",
    "mcp~=2.3.0",
    "pydantic>=2.12,<3",
    "pyjwt>=2.15",
    "uvicorn>=0.54",
]

[project.scripts]
t1-mcp-server = "ai_gateway.mcp_server.__main__:main"
t2-gateway = "ai_gateway.mcp_gateway.__main__:main"
t2-mint-jwt = "ai_gateway.mcp_gateway.mint_jwt:main"
t2-mock-downstream = "ai_gateway.mcp_gateway.mock_downstream:main"
t3-gateway = "ai_gateway.llm_gateway.__main__:main"
t3-mock-provider = "ai_gateway.llm_gateway.mock_provider:main"
t4-router = "ai_gateway.model_router.__main__:main"
t4-mock-provider = "ai_gateway.model_router.mock_provider:main"
t4-tenants = "ai_gateway.model_router.tenants:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_gateway"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra"]
strict = true
anyio_mode = "auto"
markers = [
    "e2e: starts subprocesses or real servers",
    "slow: timing-sensitive or multi-process tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "T20"]

[dependency-groups]
dev = [
    "anyio>=4.16",
    "hypothesis>=6.170",
    "openai>=3.46",
    "pytest>=9.2",
    "ruff>=0.17.4",
]
